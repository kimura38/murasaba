<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村鯖 | 公式サイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================
           基本スタイル (色はJavaScriptで上書きされます)
        ========================================= */
        :root {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body { font-family: sans-serif; background-color: var(--bg-base); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; }

        /* ナビゲーション ＆ メニュー */
        .navbar { position: fixed; top: 0; width: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; z-index: 1000; box-sizing: border-box; }
        .navbar-logo { font-size: 1.5rem; font-weight: bold; color: var(--text-main); text-decoration: none; cursor: pointer; }
        .menu-btn { font-size: 1.8rem; color: var(--text-main); cursor: pointer; }
        
        .side-menu { position: fixed; top: 0; right: -300px; width: 250px; height: 100vh; background: var(--bg-card); border-left: 1px solid var(--border-color); transition: right 0.3s ease; z-index: 1001; padding-top: 5rem; }
        .side-menu.active { right: 0; }
        .side-menu a { display: block; padding: 1.2rem 2rem; color: var(--text-main); text-decoration: none; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; }
        .side-menu a:hover { background: rgba(255,255,255,0.05); color: var(--accent); }
        .close-btn { position: absolute; top: 1rem; right: 1.5rem; font-size: 2rem; color: var(--text-muted); cursor: pointer; }

        /* コンテンツエリア (タブ切り替え) */
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 1000px; margin: 0 auto; padding: 7rem 1rem 4rem; min-height: calc(100vh - 100px); }

        /* 管理画面で使える汎用デザインクラス */
        .section-title { font-size: 1.6rem; color: var(--text-main); margin-bottom: 2rem; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; }
        .box-card { background: var(--bg-card); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .text-center { text-align: center; }
        .text-accent { color: var(--accent); }
        .text-muted { color: var(--text-muted); }

        /* トップのヒーローセクション */
        .hero { text-align: center; padding: 2rem 0 3rem; }
        .hero h1 { margin: 0; letter-spacing: 8px; font-weight: 900; background: linear-gradient(to right, var(--text-main), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* リンク一覧の専用デザイン */
        .links-list { display: flex; flex-direction: column; gap: 1.2rem; }
        .list-card { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem 2rem; text-decoration: none; color: var(--text-main); transition: all 0.3s ease; }
        .list-card:hover { transform: translateX(10px); border-color: var(--accent); }
        .list-icon { font-size: 2.5rem; margin-right: 1.5rem; width: 50px; text-align: center; }
        .list-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.3rem; }
        .list-desc { font-size: 0.9rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="navbar-logo" id="nav-title">読み込み中...</a>
        <div class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
    </nav>

    <!-- メニューとコンテンツはFirebaseから動的に生成されます -->
    <div class="side-menu" id="sideMenu"></div>
    <main class="container" id="mainContainer"></main>

    <!-- UI動作用のスクリプト -->
    <script>
        function toggleMenu() { document.getElementById("sideMenu").classList.toggle("active"); }
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById("sideMenu").classList.remove("active");
        }
    </script>

    <!-- Firebase連携 ＆ サイト自動構築スクリプト -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoRYZp8IiUeDBYFjxCj3nxsoxuebdSheY",
            authDomain: "linemodoki-pro.firebaseapp.com",
            projectId: "linemodoki-pro",
            storageBucket: "linemodoki-pro.firebasestorage.app",
            messagingSenderId: "787553651066",
            appId: "1:787553651066:web:5f1ba0d27cc6c64f43eec3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function buildWebsite() {
            try {
                const docRef = doc(db, "website", "dynamicData");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    // --- 1. デザインの適用 ---
                    if (data.design) {
                        const root = document.documentElement;
                        root.style.setProperty('--text-main', data.design.textColor || '#f8fafc');
                        root.style.setProperty('--accent', data.design.themeColor || '#10b981');
                        document.body.style.fontFamily = data.design.fontFamily || 'sans-serif';
                    }

                    // --- 2. サイトタイトルの適用 ---
                    document.getElementById('nav-title').innerText = data.site?.title || "サイト名";

                    // --- 3. メニューとページ内容の動的生成 ---
                    let menuHTML = `<div class="close-btn" onclick="toggleMenu()">&times;</div>`;
                    let mainHTML = `
                        <div class="hero">
                            <h1 style="font-size: ${data.design?.titleSize || '3.5rem'}">${data.site?.title || ''}</h1>
                            <p>${data.site?.subtitle || ''}</p>
                        </div>
                    `;

                    // 管理画面で作られたタブをすべて生成
                    if (data.tabs && data.tabs.length > 0) {
                        data.tabs.forEach((tab, index) => {
                            const isActive = index === 0 ? 'active' : '';
                            // メニューに追加
                            menuHTML += `<a onclick="switchTab('${tab.id}')"><i class="fa-solid ${tab.icon}"></i> ${tab.title}</a>`;
                            
                            // コンテンツのセクションを追加
                            mainHTML += `
                                <section id="${tab.id}" class="tab-content ${isActive}">
                                    <h2 class="section-title"><i class="fa-solid ${tab.icon}"></i> ${tab.title}</h2>
                                    ${tab.content}
                                </section>
                            `;
                        });
                    }

                    // --- 4. リンク一覧タブの自動生成 ---
                    menuHTML += `<a onclick="switchTab('tab-system-links')"><i class="fa-solid fa-link"></i> リンク一覧</a>`;
                    let linksHTML = `
                        <section id="tab-system-links" class="tab-content">
                            <h2 class="section-title"><i class="fa-solid fa-link"></i> リンク一覧</h2>
                            <div class="links-list">
                    `;
                    if (data.links) {
                        data.links.forEach(link => {
                            linksHTML += `
                                <a href="${link.url}" class="list-card" target="_blank">
                                    <div class="list-icon" style="color: ${link.color};"><i class="fa-brands ${link.icon}"></i></div>
                                    <div>
                                        <div class="list-title">${link.title}</div>
                                        <div class="list-desc">${link.desc}</div>
                                    </div>
                                </a>
                            `;
                        });
                    }
                    linksHTML += `</div></section>`;
                    mainHTML += linksHTML;

                    // 生成したHTMLをサイトに流し込む
                    document.getElementById('sideMenu').innerHTML = menuHTML;
                    document.getElementById('mainContainer').innerHTML = mainHTML;
                }
            } catch (e) {
                console.error("サイトの構築に失敗しました:", e);
                document.getElementById('nav-title').innerText = "エラー: データベースに接続できません";
            }
        }
        
        buildWebsite();
    </script>
</body>
</html>
