<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村鯖 | ライブエディター</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; background: #0f172a; color: #333; }
        
        /* 左側：エディターパネル */
        #editor-panel { width: 45%; background: #f4f7f6; overflow-y: auto; padding: 20px; box-sizing: border-box; box-shadow: 2px 0 10px rgba(0,0,0,0.2); z-index: 10; }
        
        /* 右側：プレビュー画面 */
        #preview-panel { width: 55%; background: #000; display: flex; flex-direction: column; }
        #preview-frame { flex-grow: 1; border: none; width: 100%; height: 100%; background: #0f172a; }
        .preview-header { background: #1e293b; color: white; padding: 10px; text-align: center; font-size: 0.9rem; font-weight: bold; }

        /* エディター内のデザイン */
        h2 { border-bottom: 2px solid #10b981; padding-bottom: 5px; margin-top: 2rem; color: #1e293b; }
        .box { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; position: relative; }
        label { display: block; font-weight: bold; margin-top: 10px; font-size: 0.9rem; color: #475569; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { font-family: monospace; }
        
        .btn-add { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; position: absolute; top: 15px; right: 15px; font-size: 0.8rem; }
        .btn-save { background: #10b981; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.2rem; position: sticky; bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-save:hover { background: #059669; }
    </style>
</head>
<body>

    <!-- 左側の編集パネル -->
    <div id="editor-panel">
        <h1 style="margin-top:0; color:#10b981;">⚙️ サイトエディター</h1>
        <p style="font-size: 0.9rem; color: #666;">ここで編集して「保存」を押すと、右側のプレビューが更新されます。</p>

        <h2>🎨 デザイン＆基本設定</h2>
        <div class="box">
            <label>サイトタイトル</label>
            <input type="text" id="siteTitle" onchange="appData.site.title = this.value">
            
            <label>サブタイトル</label>
            <input type="text" id="siteSubtitle" onchange="appData.site.subtitle = this.value">
            
            <label>全体の文字色</label>
            <input type="color" id="textColor" onchange="appData.design.textColor = this.value">
            
            <label>テーマカラー (アクセント色)</label>
            <input type="color" id="themeColor" onchange="appData.design.themeColor = this.value">
            
            <label>フォント (文字の形)</label>
            <select id="fontFamily" onchange="appData.design.fontFamily = this.value">
                <option value="'Helvetica Neue', Arial, sans-serif">標準ゴシック (モダンで見やすい)</option>
                <option value="'Noto Serif JP', serif">明朝体 (和風・硬派な印象)</option>
                <option value="'Courier New', monospace">等幅フォント (プログラミング風)</option>
            </select>
            
            <label>タイトルの大きさ (例: 3.5rem, 50px)</label>
            <input type="text" id="titleSize" onchange="appData.design.titleSize = this.value">
        </div>

        <h2>📑 タブ構成 (メニューとページ作成)</h2>
        <p style="font-size: 0.85rem;">内容にはHTMLタグ（&lt;h3&gt; や &lt;br&gt; など）を使って自由にレイアウトを組むことができます。</p>
        <div id="tabs-container"></div>
        <button class="btn-add" onclick="addTab()">＋ 新しいタブ（ページ）を作成</button>

        <h2>🔗 リンク一覧設定</h2>
        <div id="links-container"></div>
        <button class="btn-add" onclick="addLink()">＋ 新しいリンクを追加</button>

        <br><br>
        <button class="btn-save" id="saveBtn" onclick="saveData()">💾 保存してプレビュー更新</button>
    </div>

    <!-- 右側のプレビュー画面 -->
    <div id="preview-panel">
        <div class="preview-header">👀 ライブプレビュー (公式サイトの実際の見え方)</div>
        <iframe id="preview-frame" src="../index.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoRYZp8IiUeDBYFjxCj3nxsoxuebdSheY",
            authDomain: "linemodoki-pro.firebaseapp.com",
            projectId: "linemodoki-pro",
            storageBucket: "linemodoki-pro.firebasestorage.app",
            messagingSenderId: "787553651066",
            appId: "1:787553651066:web:5f1ba0d27cc6c64f43eec3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "website", "dynamicData");

        // アプリ全体のデータ構造 (初期値)
        window.appData = {
            design: { textColor: "#f8fafc", themeColor: "#10b981", fontFamily: "'Helvetica Neue', Arial, sans-serif", titleSize: "3.5rem" },
            site: { title: "村鯖", subtitle: "Java版 ＆ 統合版 | マルチプレイサーバー" },
            tabs: [
                { id: "tab-home", title: "ホーム", icon: "fa-house", content: "<div class='box-card'>ここにホームのテキストを入力</div>" }
            ],
            links: [
                { title: "公式Discord", url: "https://discord.gg/...", icon: "fa-discord", color: "#5865F2", desc: "説明文を入力" }
            ]
        };

        // データの読み込み
        async function loadData() {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                window.appData = docSnap.data();
            }
            
            // デザイン設定をフォームに反映
            document.getElementById('siteTitle').value = appData.site.title || "";
            document.getElementById('siteSubtitle').value = appData.site.subtitle || "";
            document.getElementById('textColor').value = appData.design.textColor || "#f8fafc";
            document.getElementById('themeColor').value = appData.design.themeColor || "#10b981";
            document.getElementById('fontFamily').value = appData.design.fontFamily || "'Helvetica Neue', Arial, sans-serif";
            document.getElementById('titleSize').value = appData.design.titleSize || "3.5rem";

            renderTabs();
            renderLinks();
        }

        // タブ編集UIの描画
        window.renderTabs = function() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = "";
            appData.tabs.forEach((tab, index) => {
                container.innerHTML += `
                    <div class="box">
                        <button class="btn-delete" onclick="deleteTab(${index})">削除</button>
                        <label>タブ名 (メニューに表示)</label>
                        <input type="text" value="${tab.title}" onchange="appData.tabs[${index}].title = this.value">
                        <label>アイコン (例: fa-book, fa-server)</label>
                        <input type="text" value="${tab.icon}" onchange="appData.tabs[${index}].icon = this.value">
                        <label>タブ内の構成・文章 (HTML使用可能)</label>
                        <textarea rows="6" onchange="appData.tabs[${index}].content = this.value">${tab.content}</textarea>
                    </div>
                `;
            });
        }

        // リンク編集UIの描画
        window.renderLinks = function() {
            const container = document.getElementById('links-container');
            container.innerHTML = "";
            appData.links.forEach((link, index) => {
                container.innerHTML += `
                    <div class="box">
                        <button class="btn-delete" onclick="deleteLink(${index})">削除</button>
                        <label>リンク名</label>
                        <input type="text" value="${link.title}" onchange="appData.links[${index}].title = this.value">
                        <label>URL (飛び先)</label>
                        <input type="text" value="${link.url}" onchange="appData.links[${index}].url = this.value">
                        <label>アイコン色 (例: #5865F2)</label>
                        <input type="color" value="${link.color}" onchange="appData.links[${index}].color = this.value">
                        <label>アイコン種類 (例: fa-discord)</label>
                        <input type="text" value="${link.icon}" onchange="appData.links[${index}].icon = this.value">
                        <label>説明文</label>
                        <input type="text" value="${link.desc}" onchange="appData.links[${index}].desc = this.value">
                    </div>
                `;
            });
        }

        // 追加・削除機能
        window.addTab = function() {
            appData.tabs.push({ id: "tab-" + Date.now(), title: "新しいタブ", icon: "fa-star", content: "新しいページです" });
            renderTabs();
        }
        window.deleteTab = function(index) {
            appData.tabs.splice(index, 1);
            renderTabs();
        }
        window.addLink = function() {
            appData.links.push({ title: "新しいリンク", url: "", icon: "fa-link", color: "#ffffff", desc: "" });
            renderLinks();
        }
        window.deleteLink = function(index) {
            appData.links.splice(index, 1);
            renderLinks();
        }

        // 保存してプレビュー更新
        window.saveData = async function() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "保存中...";
            try {
                await setDoc(docRef, appData);
                // プレビューのiframeをリロードして反映
                document.getElementById('preview-frame').contentWindow.location.reload();
                btn.innerText = "💾 保存完了 (プレビュー更新済)";
                setTimeout(() => btn.innerText = "💾 保存してプレビュー更新", 2000);
            } catch (e) {
                console.error(e);
                alert("保存エラー。Firebaseの設定を確認してください。");
            }
        }

        // 起動時に読み込み
        loadData();
    </script>
</body>
</html>
