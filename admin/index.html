<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村鯖 | サイト管理画面</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f4f7f6; color: #333; }
        .admin-box { background: #fff; padding: 2rem; border-radius: 8px; max-width: 800px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 0 auto 2rem; }
        h2 { border-bottom: 2px solid #10b981; padding-bottom: 0.5rem; }
        .section { margin-bottom: 2.5rem; background: #f8fafc; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        .section h3 { margin-top: 0; color: #0f172a; }
        label { display: block; margin-top: 1rem; font-weight: bold; font-size: 0.9rem; color: #475569; }
        input[type="text"], textarea { width: 100%; padding: 0.8rem; margin-top: 0.3rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        input[type="color"] { margin-top: 0.3rem; }
        textarea { resize: vertical; }
        .save-btn { display: block; width: 100%; padding: 1.2rem; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.2rem; position: sticky; bottom: 20px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .save-btn:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2>⚙️ サイトコンテンツ管理</h2>
        <p>ここで入力した内容が公式サイトにリアルタイムで反映されます。空欄の項目はサイト上でも空欄になります。</p>

        <div class="section">
            <h3>🎨 全体デザイン</h3>
            <label>サイト全体の文字色</label>
            <input type="color" id="textColor" value="#f8fafc">
            <label>タイトルの大きさ (例: 3.5rem, 50px)</label>
            <input type="text" id="titleSize" placeholder="3.5rem">
        </div>

        <div class="section">
            <h3>🏠 ホームタブ</h3>
            <label>サイトタイトル (例: 村鯖)</label>
            <input type="text" id="siteTitle">
            <label>サブタイトル (例: Java版 ＆ 統合版 | マルチプレイサーバー)</label>
            <input type="text" id="siteSubtitle">
            <label>当サーバーについて (説明文)</label>
            <textarea id="aboutText" rows="4"></textarea>
            
            <label>最新のお知らせ - 日付</label>
            <input type="text" id="newsDate">
            <label>最新のお知らせ - 内容</label>
            <textarea id="newsText" rows="3"></textarea>
        </div>

        <div class="section">
            <h3>🎮 サーバー参加タブ</h3>
            <label>IPアドレス (例: village-s.ddns.net)</label>
            <input type="text" id="serverIp">
            <label>Java版の説明 (例: Java版: そのまま接続)</label>
            <input type="text" id="javaDesc">
            <label>統合版の説明 (例: 統合版: ポート 19132)</label>
            <input type="text" id="bedrockDesc">
        </div>

        <div class="section">
            <h3>📖 ルールタブ (箇条書きや改行をそのまま入力してください)</h3>
            <label>サーバールール (Minecraft)</label>
            <textarea id="mcRules" rows="8"></textarea>
            <label>Discordルール</label>
            <textarea id="discordRules" rows="8"></textarea>
            <label>違反対応について</label>
            <textarea id="punishRules" rows="5"></textarea>
        </div>

        <div class="section">
            <h3>🔨 活動内容タブ</h3>
            <label>活動1：タイトル</label>
            <input type="text" id="act1Title">
            <label>活動1：説明文</label>
            <textarea id="act1Text" rows="4"></textarea>
            
            <label>活動2：タイトル</label>
            <input type="text" id="act2Title">
            <label>活動2：説明文</label>
            <textarea id="act2Text" rows="4"></textarea>
        </div>

        <button class="save-btn" id="saveBtn">💾 保存してサイトに反映する</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoRYZp8IiUeDBYFjxCj3nxsoxuebdSheY",
            authDomain: "linemodoki-pro.firebaseapp.com",
            projectId: "linemodoki-pro",
            storageBucket: "linemodoki-pro.firebasestorage.app",
            messagingSenderId: "787553651066",
            appId: "1:787553651066:web:5f1ba0d27cc6c64f43eec3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "website", "content");

        // 読み込み処理
        async function loadData() {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                const fields = ["textColor", "titleSize", "siteTitle", "siteSubtitle", "aboutText", "newsDate", "newsText", "serverIp", "javaDesc", "bedrockDesc", "mcRules", "discordRules", "punishRules", "act1Title", "act1Text", "act2Title", "act2Text"];
                fields.forEach(field => {
                    if (data[field] !== undefined) {
                        document.getElementById(field).value = data[field];
                    }
                });
            }
        }
        loadData();

        // 保存処理
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "保存中...";
            
            const dataToSave = {
                textColor: document.getElementById('textColor').value,
                titleSize: document.getElementById('titleSize').value,
                siteTitle: document.getElementById('siteTitle').value,
                siteSubtitle: document.getElementById('siteSubtitle').value,
                aboutText: document.getElementById('aboutText').value,
                newsDate: document.getElementById('newsDate').value,
                newsText: document.getElementById('newsText').value,
                serverIp: document.getElementById('serverIp').value,
                javaDesc: document.getElementById('javaDesc').value,
                bedrockDesc: document.getElementById('bedrockDesc').value,
                mcRules: document.getElementById('mcRules').value,
                discordRules: document.getElementById('discordRules').value,
                punishRules: document.getElementById('punishRules').value,
                act1Title: document.getElementById('act1Title').value,
                act1Text: document.getElementById('act1Text').value,
                act2Title: document.getElementById('act2Title').value,
                act2Text: document.getElementById('act2Text').value,
                updatedAt: new Date()
            };

            try {
                await setDoc(docRef, dataToSave);
                alert("保存完了！公式サイトをリロードして確認してください。");
            } catch (e) {
                console.error(e);
                alert("保存に失敗しました。Firebaseのルール設定を確認してください。");
            } finally {
                btn.innerText = "💾 保存してサイトに反映する";
            }
        });
    </script>
</body>
</html>
