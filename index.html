<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村鯖 | 公式サイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --discord: #5865F2;
        }

        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-base); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; }

        /* ナビゲーション ＆ メニュー */
        .navbar { position: fixed; top: 0; width: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; z-index: 1000; box-sizing: border-box; }
        .navbar-logo { font-size: 1.5rem; font-weight: bold; color: var(--text-main); text-decoration: none; cursor: pointer; }
        .menu-btn { font-size: 1.8rem; color: var(--text-main); cursor: pointer; }
        .side-menu { position: fixed; top: 0; right: -300px; width: 250px; height: 100vh; background: var(--bg-card); border-left: 1px solid var(--border-color); transition: right 0.3s ease; z-index: 1001; padding-top: 5rem; }
        .side-menu.active { right: 0; }
        .side-menu a { display: block; padding: 1.2rem 2rem; color: var(--text-main); text-decoration: none; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .close-btn { position: absolute; top: 1rem; right: 1.5rem; font-size: 2rem; color: var(--text-muted); cursor: pointer; }

        /* コンテンツエリア */
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 1000px; margin: 0 auto; padding: 7rem 1rem 4rem; min-height: calc(100vh - 100px); }
        
        /* 共通モジュール */
        .section-title { font-size: 1.6rem; color: var(--text-main); margin-bottom: 2rem; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; }
        .box-card { background: var(--bg-card); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        /* テキスト表示用のクラス (管理画面からの改行を反映させるため) */
        .pre-wrap { white-space: pre-wrap; word-break: break-all; }

        /* ヒーロー */
        .hero { text-align: center; padding: 2rem 0 3rem; }
        .hero h1 { font-size: 3.5rem; margin: 0; letter-spacing: 8px; background: linear-gradient(to right, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .hero p { color: var(--text-muted); font-size: 1.1rem; }

        /* ニュース・IP */
        .news-item { display: flex; gap: 1.5rem; padding: 1rem 0; }
        .news-date { color: var(--accent); font-weight: bold; white-space: nowrap; }
        .ip-box { display: flex; align-items: center; justify-content: center; gap: 15px; background: #000; border: 1px solid var(--border-color); padding: 1.5rem 2rem; border-radius: 8px; font-family: monospace; font-size: 1.8rem; margin: 2rem auto; max-width: 600px; }
        .copy-btn { background: var(--border-color); color: var(--text-main); border: none; padding: 0.8rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        /* リンク一覧 */
        .links-list { display: flex; flex-direction: column; gap: 1.2rem; }
        .list-card { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem 2rem; text-decoration: none; color: var(--text-main); transition: all 0.3s ease; }
        .list-card:hover { transform: translateX(10px); border-color: var(--accent); }
        .list-icon { font-size: 2.5rem; margin-right: 1.5rem; width: 50px; text-align: center; }
        .list-content { flex-grow: 1; }
        .list-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.3rem; }
        .list-desc { font-size: 0.9rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a onclick="switchTab('tab-home')" class="navbar-logo" id="nav-siteTitle"></a>
        <div class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
    </nav>

    <div class="side-menu" id="sideMenu">
        <div class="close-btn" onclick="toggleMenu()">&times;</div>
        <a onclick="switchTab('tab-home')"><i class="fa-solid fa-house"></i> ホーム</a>
        <a onclick="switchTab('tab-server')"><i class="fa-solid fa-server"></i> サーバー参加</a>
        <a onclick="switchTab('tab-rules')"><i class="fa-solid fa-book"></i> ルール</a>
        <a onclick="switchTab('tab-activity')"><i class="fa-solid fa-code"></i> 活動内容</a>
        <a onclick="switchTab('tab-links')"><i class="fa-solid fa-link"></i> リンク一覧</a>
    </div>

    <main class="container">
        <!-- 1. ホーム -->
        <section id="tab-home" class="tab-content active">
            <div class="hero">
                <h1 id="v-siteTitle"></h1>
                <p id="v-siteSubtitle"></p>
            </div>
            <div class="box-card">
                <p id="v-aboutText" class="pre-wrap" style="color: var(--text-muted); line-height: 1.8; text-align: center;"></p>
            </div>
            <h2 class="section-title"><i class="fa-solid fa-bullhorn"></i> お知らせ</h2>
            <div class="box-card" style="padding: 1rem 2rem;">
                <div class="news-item">
                    <div class="news-date" id="v-newsDate"></div>
                    <div class="pre-wrap" id="v-newsText"></div>
                </div>
            </div>
        </section>

        <!-- 2. サーバー参加 -->
        <section id="tab-server" class="tab-content">
            <h2 class="section-title"><i class="fa-solid fa-server"></i> サーバーに参加する</h2>
            <div class="box-card" style="text-align: center;">
                <div class="ip-box">
                    <i class="fa-solid fa-terminal" style="color: #334155;"></i>
                    <span style="color: var(--accent);" id="v-serverIp"></span>
                    <button class="copy-btn" id="copyBtn" onclick="copyIP()"><i class="fa-regular fa-copy"></i> コピー</button>
                </div>
                <div style="display: flex; justify-content: center; gap: 2rem; color: var(--text-muted); margin-top: 1.5rem;">
                    <div id="v-javaDesc"></div>
                    <div id="v-bedrockDesc"></div>
                </div>
            </div>
        </section>

        <!-- 3. ルール -->
        <section id="tab-rules" class="tab-content">
            <h2 class="section-title"><i class="fa-solid fa-book"></i> ルール</h2>
            <div class="box-card">
                <h3 style="color: var(--accent);"><i class="fa-solid fa-cube"></i> サーバールール (Minecraft)</h3>
                <p id="v-mcRules" class="pre-wrap" style="color: var(--text-muted);"></p>
            </div>
            <div class="box-card">
                <h3 style="color: var(--accent);"><i class="fa-brands fa-discord"></i> Discordルール</h3>
                <p id="v-discordRules" class="pre-wrap" style="color: var(--text-muted);"></p>
            </div>
            <div class="box-card" style="border-color: #ef4444;">
                <h3 style="color: #ef4444;"><i class="fa-solid fa-gavel"></i> 違反対応について</h3>
                <p id="v-punishRules" class="pre-wrap" style="color: var(--text-muted);"></p>
            </div>
        </section>

        <!-- 4. 活動内容 -->
        <section id="tab-activity" class="tab-content">
            <h2 class="section-title"><i class="fa-solid fa-hammer"></i> 活動内容</h2>
            <div class="box-card">
                <h3 style="color: var(--accent);" id="v-act1Title"></h3>
                <p id="v-act1Text" class="pre-wrap" style="color: var(--text-muted); margin-bottom: 2rem;"></p>
                <h3 style="color: var(--accent);" id="v-act2Title"></h3>
                <p id="v-act2Text" class="pre-wrap" style="color: var(--text-muted);"></p>
            </div>
        </section>

        <!-- 5. リンク一覧 (※リンク先URLは固定、文字のみ自由変更しない場合はこのまま) -->
        <section id="tab-links" class="tab-content">
            <h2 class="section-title"><i class="fa-solid fa-link"></i> リンク一覧</h2>
            <div class="links-list">
                <a href="https://discord.gg/2qPETeMwcj" class="list-card" target="_blank">
                    <div class="list-icon" style="color: var(--discord);"><i class="fa-brands fa-discord"></i></div>
                    <div class="list-content">
                        <div class="list-title">公式Discord</div>
                        <div class="list-desc">ルールの確認、最新情報、プレイヤー同士の交流はこちら。</div>
                    </div>
                </a>
                <a href="https://discord-pied-pi.vercel.app/" class="list-card" target="_blank">
                    <div class="list-icon" style="color: #f59e0b;"><i class="fa-solid fa-comments"></i></div>
                    <div class="list-content">
                        <div class="list-title">Webチャット</div>
                        <div class="list-desc">ブラウザから直接村鯖のチャットを確認・発言できる連携ツールです。</div>
                    </div>
                </a>
                <a href="https://kimura38.github.io/mc-village-server/" class="list-card" target="_blank">
                    <div class="list-icon" style="color: #3b82f6;"><i class="fa-solid fa-chart-line"></i></div>
                    <div class="list-content">
                        <div class="list-title">サーバーステータス</div>
                        <div class="list-desc">サーバーの稼働状況や、オンライン人数をリアルタイムで確認できます。</div>
                    </div>
                </a>
                <a href="https://discord.com/oauth2/authorize?client_id=1538733788228747416&permissio" class="list-card" target="_blank">
                    <div class="list-icon" style="color: #9b59b6;"><i class="fa-solid fa-robot"></i></div>
                    <div class="list-content">
                        <div class="list-title">自作Discordボット</div>
                        <div class="list-desc">サーバー運営を便利にするために自作したオリジナルBotです。</div>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <!-- UI動作 -->
    <script>
        function toggleMenu() { document.getElementById("sideMenu").classList.toggle("active"); }
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById("sideMenu").classList.remove("active");
        }
        function copyIP() {
            const ip = document.getElementById("v-serverIp").innerText;
            if(!ip) return;
            navigator.clipboard.writeText(ip).then(() => {
                const btn = document.getElementById("copyBtn");
                const originalContent = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> コピー完了';
                btn.style.background = "var(--accent)"; btn.style.color = "#fff";
                setTimeout(() => { btn.innerHTML = originalContent; btn.style.background = ""; btn.style.color = ""; }, 2000);
            });
        }
    </script>

    <!-- Firebase受信・テキスト書き換え処理 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoRYZp8IiUeDBYFjxCj3nxsoxuebdSheY",
            authDomain: "linemodoki-pro.firebaseapp.com",
            projectId: "linemodoki-pro",
            storageBucket: "linemodoki-pro.firebasestorage.app",
            messagingSenderId: "787553651066",
            appId: "1:787553651066:web:5f1ba0d27cc6c64f43eec3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadContent() {
            try {
                // 今回は "content" というドキュメントからデータを取得します
                const docRef = doc(db, "website", "content");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // デザイン設定の適用
                    if (data.textColor) document.documentElement.style.setProperty('--text-main', data.textColor);
                    if (data.titleSize) document.getElementById('v-siteTitle').style.fontSize = data.titleSize;

                    // IDとFirebaseのキーを紐付けて一括でテキストを挿入
                    const fieldMap = {
                        "siteTitle": ["v-siteTitle", "nav-siteTitle"],
                        "siteSubtitle": ["v-siteSubtitle"],
                        "aboutText": ["v-aboutText"],
                        "newsDate": ["v-newsDate"],
                        "newsText": ["v-newsText"],
                        "serverIp": ["v-serverIp"],
                        "javaDesc": ["v-javaDesc"],
                        "bedrockDesc": ["v-bedrockDesc"],
                        "mcRules": ["v-mcRules"],
                        "discordRules": ["v-discordRules"],
                        "punishRules": ["v-punishRules"],
                        "act1Title": ["v-act1Title"],
                        "act1Text": ["v-act1Text"],
                        "act2Title": ["v-act2Title"],
                        "act2Text": ["v-act2Text"]
                    };

                    // Firebaseから取得したデータを該当するHTMLのIDに注入
                    for (const [key, elementIds] of Object.entries(fieldMap)) {
                        if (data[key] !== undefined) {
                            elementIds.forEach(id => {
                                const el = document.getElementById(id);
                                if(el) el.innerText = data[key];
                            });
                        }
                    }
                }
            } catch (e) {
                console.error("Firebaseからのデータ取得エラー:", e);
            }
        }
        
        loadContent();
    </script>
</body>
</html>
